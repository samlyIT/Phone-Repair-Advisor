{% extends "layouts/base.html" %}
{% block title %}{{ 'Edit' if rule else 'Add' }} Rule{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{{ 'Edit' if rule else 'Add' }} Rule</h1>
    <form method="POST" action="{{ url_for('admin.edit_rule', rule_id=rule.id) if rule else url_for('admin.add_rule') }}">
        <div class="mb-3">
            <label for="name" class="form-label">Rule Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ rule.name if rule else '' }}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="priority" class="form-label">Priority</label>
                <input type="number" class="form-control" id="priority" name="priority" value="{{ rule.priority if rule else '1' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="confidence" class="form-label">Confidence</label>
                <input type="number" step="0.01" min="0" max="1" class="form-control" id="confidence" name="confidence" value="{{ rule.confidence if rule else '1.0' }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="conditions" class="form-label">Conditions (JSON)</label>
            <textarea class="form-control" id="conditions" name="conditions" rows="10" required>{{ rule.conditions | tojson(indent=4) if rule else '[]' }}</textarea>
        </div>
        <div class="mb-3">
            <label for="actions" class="form-label">Actions (JSON)</label>
            <textarea class="form-control" id="actions" name="actions" rows="5" required>{{ rule.actions | tojson(indent=4) if rule else '[]' }}</textarea>
        </div>
        <div class="mb-3">
            <label for="repair_id" class="form-label">Recommended Repair (optional)</label>
            <select id="repair_id" name="repair_id" class="form-select select2">
                <option value="">-- Select a recommended repair (optional) --</option>
                {% for r in repairs %}
                  <option value="{{ r.id }}" {% if rule and rule.repair_id == r.id %}selected{% endif %}>Repair #{{ r.id }} — {{ r.issue.name }} (Priority: {{ r.priority }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">{{ 'Update' if rule else 'Add' }} Rule</button>
        <a href="{{ url_for('admin.manage_rules') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
