{% extends "layouts/base.html" %}
{% block title %}{{ 'Edit' if symptom else 'Add' }} Symptom{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{{ 'Edit' if symptom else 'Add' }} Symptom</h1>
    <form method="POST" action="{{ url_for('admin.edit_symptom', symptom_id=symptom.id) if symptom else url_for('admin.add_symptom') }}">
        <div class="mb-3">
            <label for="code" class="form-label">Symptom Code</label>
            <input type="text" class="form-control" id="code" name="code" value="{{ symptom.code if symptom else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" name="description" value="{{ symptom.description if symptom else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="question" class="form-label">Question</label>
            <input type="text" class="form-control" id="question" name="question" value="{{ symptom.question if symptom else '' }}">
        </div>
        <button type="submit" class="btn btn-primary">{{ 'Update' if symptom else 'Add' }} Symptom</button>
        <a href="{{ url_for('admin.manage_symptoms') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
